; Firmware du boîtier infrarouge (ESP32) qui pilote la climatisation.
; Compiler + flasher :  pio run -t upload
; Moniteur série     :  pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Application plus grosse que la partition par défaut (toutes les marques de clim
; sont incluses) : on agrandit la partition programme.
board_build.partitions = min_spiffs.csv

lib_deps =
  crankyoldgit/IRremoteESP8266@2.8.6
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1

build_flags =
  ; Broche de la LED infrarouge (émetteur)
  -DIR_SEND_PIN=4
  ; Broche du récepteur infrarouge (VS1838B / TSOP38238). Mettre -1 si absent.
  -DIR_RECV_PIN=14
  ; Nom sur le réseau : http://clim.local
  -DHOSTNAME=\"clim\"

; L'application web est intégrée directement dans le firmware.
board_build.embed_txtfiles =
  web/index.html
  web/app.js
  web/style.css
  web/manifest.webmanifest
  web/sw.js
  web/icon.svg
board_build.embed_files =
  web/icon-192.png
  web/icon-512.png
  web/apple-touch-icon.png
